<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Felina's Valley Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Felina's Valley Tracker</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Purple theme (default) */
:root{
  --bg:#2a2250;--text:#f3effc;--muted:#c8bfec;--accent:#f4c95d;
  --card:#ebe6fb;--cardText:#141414;--cardMuted:#4a4466;
  --field:#ffffff;--fieldBorder:#c3b8ea;--btn:#d6cdf5;
  --done:#2e9e6a;--doneBg:#dcf3e7;--fav:#e0a800;
}
/* Blue theme */
:root[data-theme="blue"]{
  --bg:#16294a;--text:#eef4ff;--muted:#b9cbe8;
  --card:#e4eefc;--cardMuted:#3f4f68;
  --fieldBorder:#b3c7e6;--btn:#c9daf4;
}
/* Pink theme */
:root[data-theme="pink"]{
  --bg:#682244;--text:#fff0f6;--muted:#f6c6dc;
  --card:#fde6f0;--cardMuted:#6e3a54;
  --fieldBorder:#efb3cd;--btn:#f8cfe1;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:calc(env(safe-area-inset-top) + 8px) 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 0}
h1{margin:0;font-size:1.6rem;color:var(--accent)}
.titleRow{display:flex;align-items:center;gap:10px}
.refresh{padding:6px 12px;font-size:.95rem;font-weight:600;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:999px;flex:none}
h2{margin:22px 0 4px;font-size:1.25rem;color:var(--accent)}
.progress{color:var(--muted)}
.sortBox{display:flex;flex-direction:column;gap:6px}
.sortBox label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.sortBox input{width:20px;height:20px;padding:0;accent-color:var(--done)}
.progress .allDone{color:#5dd39e;font-weight:700}
button,select,input,textarea{font:inherit;color:var(--cardText);background:var(--field);border:1px solid var(--fieldBorder);border-radius:10px;padding:10px}
button{cursor:pointer;background:var(--btn)}
.primary{background:var(--accent);color:#1d1838;border:none;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);color:var(--cardText);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:3px solid transparent}
.card.complete{border-color:var(--done);background:var(--doneBg)}
.card.isFav{border-color:var(--fav)}
.card.complete.isFav{border-color:var(--done)}
/* Villager partial progress: orange = gifted only, brown = collected only */
.card.giftOnly{border-color:#e8892b;background:#ffe6cc}
.card.collectOnly{border-color:#8b5a2b;background:#ecdccb}
.row{display:flex;gap:8px;align-items:center}
.name{font-size:1.2rem;font-weight:700;flex:1;min-width:0;border:none;background:transparent;padding:4px 0}
.toggle{width:100%;padding:14px;font-size:1.05rem;font-weight:600}
.toggle.on{background:var(--done);color:#fff;border:none}
.btnRow{display:flex;gap:8px}
.btnRow .toggle{flex:1;min-width:0}
.careGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.careGrid .toggle{padding:12px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;font-size:.9rem;border-radius:999px}
.chip.on{background:var(--cardText);color:var(--card);border-color:var(--cardText)}
.chip:disabled{opacity:.4}
.sparkle{display:flex;align-items:center;gap:8px;font-weight:600}
.sparkle input{width:22px;height:22px;padding:0;accent-color:var(--fav)}
.toggle:disabled{opacity:.4;cursor:not-allowed}
.giftNote{width:100%;min-height:0;line-height:1.35}
.card select,.card input:not(.name),.card textarea{font-size:1.08rem;font-weight:700}
.card ::placeholder{font-weight:400}
.fieldLabel{font-size:.85rem;font-weight:600;color:var(--cardMuted);margin-bottom:-4px}
textarea{width:100%;min-height:60px;resize:vertical}
.add{display:flex;gap:8px;margin:8px 0 14px}
.add input{flex:1;min-width:0}
.empty{color:var(--muted);margin:0 0 8px}
details{margin-top:28px;color:var(--muted)}
details .row{flex-wrap:wrap;margin-top:10px}
.backupRow{display:flex;gap:8px}
.backupRow button{padding:6px 12px;font-size:.9rem;font-weight:600}
.del,.fav{background:transparent;border:none;padding:4px 6px;font-size:1.3rem;line-height:1}
.del{color:var(--cardMuted);display:flex}
.del svg{width:20px;height:20px;pointer-events:none}
.fav{color:#9b94b5}
.isFav .fav{color:var(--fav)}
.checklist{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:8px;align-items:center}
.item textarea{flex:1;min-width:0;min-height:0;resize:none;overflow:hidden;line-height:1.35}
.item.on textarea{text-decoration:line-through;color:var(--cardMuted)}
.check{width:42px;height:42px;padding:0;font-size:1.2rem;flex:none}
.check.on{background:var(--done);color:#fff;border:none}
.counter{display:flex;align-items:center;gap:10px}
.counter .num{font-size:1.25rem;font-weight:700;min-width:64px;text-align:center}
.counter.on .num{color:var(--done)}
.step{width:44px;height:44px;padding:0;font-size:1.4rem;font-weight:700;flex:none}
.step:disabled{opacity:.4}
.mini{background:transparent;border:none;color:var(--cardMuted);padding:4px 8px;font-size:1.1rem;flex:none}
.addRow{display:flex;gap:8px;flex-wrap:wrap}
.small{padding:6px 12px;font-size:.9rem;background:transparent;border:1px dashed var(--cardMuted);color:var(--cardMuted)}
/* DLC picker, top notes, collapsible sections, villager filter */
.dlcRow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.dlcRow select{padding:6px 10px}
.topNotes{margin:4px 0 6px;color:var(--muted)}
.topNotes summary{cursor:pointer;font-weight:600}
.topNotes textarea{margin-top:8px;min-height:90px;font-weight:600}
/* Item lookup + villager gift slots */
.lookup{margin:4px 0 10px;color:var(--muted)}
.lookup input{width:min(100%,360px);padding:8px 10px}
.lookupResults{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lookupItem{background:var(--card);color:var(--cardText);border-radius:10px;padding:8px 12px}
.lookupItem b{font-size:1.05rem}
.meta{font-size:.85rem;color:var(--cardMuted)}
.giftSlots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;flex-direction:column;gap:2px}
.slot .row input{flex:1;min-width:0}
.slot .where{font-size:.85rem;color:var(--cardMuted);padding-left:50px}
.credit{font-size:.8rem}
.secHead{display:flex;align-items:center;gap:8px;margin:22px 0 4px;padding:0;background:transparent;border:none;color:var(--accent);font-size:1.25rem;font-weight:700}
.secHead .caret{display:inline-block;width:1em;transition:transform .15s}
.secHead.closed .caret{transform:rotate(-90deg)}
.section.closed{display:none}
.filterRow{display:flex;align-items:center;gap:8px;color:var(--muted);margin:4px 0 8px}
.filterRow select{padding:6px 10px}
.filterBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:4px 0 8px}
.filterBar .filterRow{margin:0}
.findBox{display:flex;align-items:center;gap:6px;color:var(--muted)}
.findBox input{width:180px;padding:6px 10px}
.clearBtn{padding:6px 10px;font-size:.9rem;font-weight:600}
/* Dreamsnap heart + hover labels for the star and heart */
.heart{background:transparent;border:none;padding:4px 6px;font-size:1.3rem;line-height:1;color:#9b94b5}
.heart.on{color:#e0457b}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;padding:3px 8px;border-radius:6px;background:#141414;color:#fff;font-size:.75rem;font-weight:600;white-space:nowrap;pointer-events:none;z-index:5}
/* BFF checkbox + gold level bar */
.bffRow{display:flex;align-items:center;gap:10px}
.bff{display:flex;align-items:center;gap:6px;font-weight:700}
.bff input{width:22px;height:22px;padding:0;accent-color:#d4a000}
.goldBar{display:flex;gap:3px}
.goldBar button{width:34px;height:22px;padding:0;border-radius:5px;background:#e8e3d3;border:1px solid #cfc6a8}
.goldBar button.on{background:#d9c690;border-color:#c4b27a}
.bffOn .goldBar button.on{background:#ffc20e;border-color:#e0a800;box-shadow:0 0 6px rgba(255,194,14,.7)}
.goldPct{font-size:.9rem;font-weight:700;color:var(--cardMuted);min-width:38px}
</style>
</head>
<body>
<header>
  <div><div class="titleRow"><h1>Felina's Valley Tracker</h1><button id="refreshBtn" class="refresh" aria-label="Refresh">⟳ Refresh</button></div><div class="progress" id="progress"></div></div>
  <div class="sortBox">
  <label class="dlcRow">DLC <select id="dlc">
    <option>1-Main</option><option>2-Eternity</option><option>3-Storybook</option><option>4-Honeyglow</option>
    <option>5-Wishblossom</option><option>6-Devildump</option><option>7-Sea</option>
  </select></label>
  <select id="sort" aria-label="Sort villagers">
    <option value="default" selected>Default (♥ ★ level BFF gold)</option>
    <option value="name">A–Z</option>
    <option value="todo">Not gifted first</option>
    <option value="uncollected">Not collected first</option>
    <option value="specialty">Specialty</option>
    <option value="level">Level: high to low</option>
    <option value="levelUp">Level: low to high</option>
  </select>
  <label><input type="checkbox" id="completedLast"> Move completed to bottom</label>
  <div class="backupRow">
    <button id="saveFileBtn" title="Save to Files → iCloud Drive">💾 Backup</button>
    <button id="loadFileBtn" title="Load a backup file">📂 Restore</button>
    <input type="file" id="loadFileInput" accept=".json,application/json,text/plain" hidden>
  </div>
  </div>
</header>

<details class="topNotes" id="topNotes">
  <summary>📝 Notes</summary>
  <textarea id="generalNotes" placeholder="Anything you want to remember — these notes don't reset."></textarea>
</details>

<div class="lookup">
  <label>🔍 Where to find <input id="itemLookup" list="itemNames" placeholder="Type an item (e.g. Apple)" autocomplete="off"></label>
  <div class="lookupResults" id="lookupResults"></div>
</div>
<datalist id="itemNames"></datalist>

<button class="secHead" data-sec="activities"><span class="caret">▾</span>Daily activities</button>
<div class="section" data-sec="activities">
<form class="add" id="addActivity">
  <input id="newActivity" placeholder="Add an activity (e.g. Star Path duty)" autocomplete="off">
  <button class="primary">Add</button>
</form>
<div class="grid" id="activities"></div>
</div>

<button class="secHead" data-sec="horses"><span class="caret">▾</span>Horses</button>
<div class="section" data-sec="horses">
<form class="add" id="addHorse">
  <input id="newHorse" placeholder="Add a horse" autocomplete="off">
  <button class="primary">Add</button>
</form>
<div class="grid" id="horses"></div>
</div>

<button class="secHead" data-sec="villagers"><span class="caret">▾</span>Villagers</button>
<div class="section" data-sec="villagers">
<form class="add" id="addForm">
  <input id="newName" placeholder="Add a villager (e.g. Goofy)" autocomplete="off">
  <button class="primary">Add</button>
</form>
<div class="filterBar">
  <label class="findBox">Find <input id="findVillager" list="villagerNames" placeholder="Villager name" autocomplete="off"></label>
  <datalist id="villagerNames"></datalist>
  <label class="filterRow">Show <select id="specFilter"></select></label>
  <button id="clearFilters" class="clearBtn" title="Show all villagers">✕ Clear</button>
</div>
<div class="grid" id="list"></div>
</div>

<details>
  <summary>Settings &amp; backup</summary>
  <div class="row">
    <label>Color theme <select id="theme">
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="pink">Pink</option>
    </select></label>
  </div>
  <div class="row">
    <label>Daily reset at <input type="time" id="resetTime"></label>
    <button id="resetNow">Reset daily items now</button>
  </div>
  <div class="row">
    <button id="exportBtn">Copy backup text</button>
    <button id="importBtn">Paste backup text</button>
  </div>
  <p id="lastReset"></p>
  <p class="credit">Item locations from the <a href="https://dreamlightvalleywiki.com" target="_blank" rel="noopener" style="color:inherit">Dreamlight Valley Wiki</a> (CC BY-NC-SA), updated when the game adds new items.</p>
</details>

<script>
const KEY = 'ddvTracker';
const SPECIALTIES = ['None','Digging','Fishing','Foraging','Gardening','Mining','Timebending','Snippet Hunting'];
const HORSE_SPECIALTIES = ['Water Crops','Digging','Remove Night Thorns','Harvesting','Mining'];
let state = JSON.parse(localStorage.getItem(KEY) || 'null') ||
            { villagers: [], resetTime: '05:00', lastReset: 0 };
// Fill in fields added after the first version so older saves keep working
function upgrade() {
  state.activities = state.activities || [];
  state.horses = state.horses || [];
  // Drop any horse specialties that aren't on the horse list (from before it had its own list)
  state.horses.forEach(h => { h.specialties = (h.specialties || []).filter(s => HORSE_SPECIALTIES.includes(s)); });
  state.theme = state.theme || 'purple';
  state.completedLast = !!state.completedLast;
  state.dlc = state.dlc || '1-Main';
  state.generalNotes = state.generalNotes || '';
  state.collapsed = state.collapsed || {};
  state.specFilter = state.specFilter || 'all';
  state.villagers.forEach(v => {
    if (!Array.isArray(v.gifts)) {
      v.gifts = [0, 1, 2].map(() => ({ item: '', done: false }));
      v.giftedBtn = !!v.gifted;   // keep today's Gifted taps from before the gift slots existed
    }
  });
}
upgrade();

const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
const applyTheme = () => document.documentElement.dataset.theme = state.theme;

// Most recent time the daily reset should have happened
function lastBoundary() {
  const [h, m] = state.resetTime.split(':').map(Number);
  const b = new Date(); b.setHours(h, m, 0, 0);
  if (Date.now() < b) b.setDate(b.getDate() - 1);
  return b.getTime();
}

// Clears villager and horse daily toggles (incl. BFF and gold level), "Today's gift" boxes, activity checkmarks, checklists and counters
function checkReset(force) {
  if (force || state.lastReset < lastBoundary()) {
    state.villagers.forEach(v => { v.gifted = false; v.giftedBtn = false; v.giftNote = ''; v.collected = false; v.bff = false; v.gold = 0; v.gifts.forEach(g => { g.done = false; }); });
    state.horses.forEach(h => { HORSE_TASKS.forEach(([k]) => { h[k] = false; }); h.giftNote = ''; });
    state.activities.forEach(a => { a.done = false; if (a.goal) a.count = 0; (a.items || []).forEach(i => { i.done = false; }); });
    state.lastReset = Date.now();
    save(); render();
  }
}

// Dreamsnap (heart) cards sort first, then favorites (star), then the chosen order
const byFav = (a, b) => (!!b.snap - !!a.snap) || (!!b.fav - !!a.fav);
// Default villager order: level 9 down to 0, then 10 · BFFs first · gold level low to high · specialty · A–Z
const levelRank = v => v.level === 10 ? -1 : v.level;
const bySpecialty = (a, b) => ((a.specialty || 'None') === 'None') - ((b.specialty || 'None') === 'None') ||
  (a.specialty || '').localeCompare(b.specialty || '');
const defaultVillagerSort = (a, b) =>
  (levelRank(b) - levelRank(a)) || (!!b.bff - !!a.bff) || ((a.gold || 0) - (b.gold || 0)) ||
  bySpecialty(a, b) || a.name.localeCompare(b.name);
const GOLD_STEPS = 4; // 25%, 50%, 75%, 100% — shown on level 10 villagers only
// Horses: five daily care tasks (stored as fields on each horse) and their own specialty list
const HORSE_TASKS = [['pet', 'Pet', '🤚'], ['brush', 'Brush', '🪮'], ['feed', 'Feed', '🥕'], ['ride', 'Ride', '🏇'], ['gifted', 'Gift', '🎁']];
const horseDone = h => h.level > 0 && HORSE_TASKS.every(([k]) => h[k]);
const levelSelect = x => `<label>Level <select data-f="level">${
  Array.from({length:11}, (_, i) => `<option ${x.level == i ? 'selected' : ''}>${i}</option>`).join('')
}</select></label>`;
// When "Move completed to bottom" is checked, finished cards go below unfinished ones
const lastIfDone = (aDone, bDone) => state.completedLast ? (!!aDone - !!bDone) : 0;
// "Collected" only applies to villagers at level 7 or higher
const canCollect = v => v.level >= 7;
const needsCollect = v => canCollect(v) && !v.collected;
// Level 0 villagers can't be gifted yet
const canGift = v => v.level > 0;
const needsGift = v => canGift(v) && !v.gifted;
// Level 10: done once collected (gifting doesn't change the color). Below 10: gifted (+ collected from level 7).
const villagerDone = v => v.level === 10 ? !!v.collected : canGift(v) && v.gifted && (v.collected || !canCollect(v));
const villagerColor = v => villagerDone(v) ? 'complete'
  : v.level === 10 || !canCollect(v) ? ''
  : v.gifted ? 'giftOnly' : v.collected ? 'collectOnly' : '';
// Item list (items.json, built weekly from the wiki) for the lookup box and gift slots
let ITEMS = [];
const itemIndex = new Map();
const findItemInfo = name => itemIndex.get(String(name || '').trim().toLowerCase());
// "Main-Plaza, Forgotten Lands · Eternity-Glittering Dunes"
const areasText = info => (info.areas || []).map(([realm, places]) => (realm ? realm + '-' : '') + places.join(', ')).join(' · ');
const whereText = info => info && info.areas && info.areas.length ? '📍 ' + areasText(info) : '';
fetch('items.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  ITEMS = d.items || [];
  ITEMS.forEach(i => itemIndex.set(i.name.toLowerCase(), i));
  document.getElementById('itemNames').innerHTML = ITEMS.map(i => `<option value="${esc(i.name)}">`).join('');
  render(); showLookup();
}).catch(() => {});
const giftSlotsHtml = v => `
      <div class="fieldLabel">Gifts (checks clear daily) — ${v.gifts.filter(g => g.done).length}/3</div>
      <div class="giftSlots">${v.gifts.map((g, i) => `
        <div class="slot" data-slot="${i}">
          <div class="row">
            <button class="check ${g.done ? 'on' : ''}" data-act="giftSlot" aria-label="Gift ${i + 1} given" ${canGift(v) ? '' : 'disabled'}>${g.done ? '✓' : ''}</button>
            <input data-f="giftItem" list="itemNames" value="${esc(g.item)}" placeholder="Gift ${i + 1}" autocomplete="off" ${canGift(v) ? '' : 'disabled'}>
          </div>
          <div class="where">${esc(whereText(findItemInfo(g.item)))}</div>
        </div>`).join('')}
      </div>`;
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>';
// Activities with a checklist or counter complete themselves once every item is checked and the count is reached
const hasTracking = a => (a.items && a.items.length) || a.goal;
const trackingDone = a => (a.items || []).every(i => i.done) && (!a.goal || (a.count || 0) >= a.goal);
const checklistHtml = a => {
  const items = (a.items || []).map(i => `
        <div class="item ${i.done ? 'on' : ''}" data-item="${i.id}">
          <button class="check ${i.done ? 'on' : ''}" data-act="toggleItem" aria-label="${i.done ? 'Uncheck' : 'Check'}">${i.done ? '✓' : ''}</button>
          <textarea data-f="itemText" rows="1" placeholder="Item">${esc(i.text)}</textarea>
          <button class="mini" data-act="delItem" aria-label="Remove item">✕</button>
        </div>`).join('');
  const count = a.count || 0;
  const counter = a.goal ? `
        <div class="counter ${count >= a.goal ? 'on' : ''}">
          <button class="step" data-act="dec" aria-label="One less" ${count <= 0 ? 'disabled' : ''}>−</button>
          <span class="num">${count} / ${a.goal}</span>
          <button class="step" data-act="inc" aria-label="One more" ${count >= a.goal ? 'disabled' : ''}>+</button>
          <button class="mini" data-act="delCounter" aria-label="Remove counter">✕</button>
        </div>` : '';
  return `
      ${items || counter ? `<div class="checklist">${items}${counter}</div>` : ''}
      <div class="addRow">
        <button class="small" data-act="addItem">＋ Checklist item</button>
        ${a.goal ? '' : '<button class="small" data-act="addCounter">＋ Counter</button>'}
      </div>`;
};
const favButton = item =>
  `<button class="fav" data-act="fav" data-tip="Favorite" aria-label="Favorite" aria-pressed="${!!item.fav}">${item.fav ? '★' : '☆'}</button>` +
  `<button class="heart ${item.snap ? 'on' : ''}" data-act="snap" data-tip="Dreamsnap" aria-label="Dreamsnap" aria-pressed="${!!item.snap}">${item.snap ? '♥' : '♡'}</button>`;
const bffHtml = v => {
  const gold = v.gold || 0;
  return `
      <div class="bffRow ${v.bff ? 'bffOn' : ''}">
        <label class="bff"><input type="checkbox" data-f="bff" ${v.bff ? 'checked' : ''}> BFF</label>
        <div class="goldBar" aria-label="Gold level">${Array.from({length: GOLD_STEPS}, (_, i) =>
          `<button class="${i < gold ? 'on' : ''}" data-act="gold" data-n="${i + 1}" aria-label="${(i + 1) * 25}%"></button>`).join('')}</div>
        <span class="goldPct">${gold * 25}%</span>
      </div>`;
};

// Checklist item boxes grow to fit their text
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + (el.offsetHeight - el.clientHeight) + 'px';
}
window.addEventListener('resize', () => document.querySelectorAll('.item textarea').forEach(autoGrow));

function render() {
  const as = [...state.activities].sort((a, b) =>
    lastIfDone(a.done, b.done) || byFav(a, b) || a.name.localeCompare(b.name));

  document.getElementById('activities').innerHTML = as.length ? as.map(a => `
    <div class="card ${a.done ? 'complete' : ''} ${a.fav ? 'isFav' : ''}" data-kind="activities" data-id="${a.id}">
      <div class="row">
        ${favButton(a)}
        <input class="name" data-f="name" value="${esc(a.name)}">
        <button class="del" data-act="del" aria-label="Delete" title="Delete">${TRASH}</button>
      </div>
      <div class="fieldLabel">Notes</div>
      <textarea data-f="notes" placeholder="Details, where to go, rewards…">${esc(a.notes)}</textarea>${checklistHtml(a)}
      <button class="toggle ${a.done ? 'on' : ''}" data-act="done">${a.done ? '✅ Done today' : 'Mark complete'}</button>
    </div>`).join('') : '<p class="empty">No daily activities yet.</p>';

  const hs = [...state.horses].sort((a, b) =>
    lastIfDone(horseDone(a), horseDone(b)) || byFav(a, b) || a.name.localeCompare(b.name));

  document.getElementById('horses').innerHTML = hs.length ? hs.map(h => {
    const specs = h.specialties || [];
    return `
    <div class="card ${horseDone(h) ? 'complete' : ''} ${h.fav ? 'isFav' : ''}" data-kind="horses" data-id="${h.id}">
      <div class="row">
        ${favButton(h)}
        <input class="name" data-f="name" value="${esc(h.name)}">
        <button class="del" data-act="del" aria-label="Delete" title="Delete">${TRASH}</button>
      </div>
      <div class="row">
        ${levelSelect(h)}
        <label class="sparkle"><input type="checkbox" data-f="sparkles" ${h.sparkles ? 'checked' : ''}> ✨ Sparkles</label>
      </div>
      <div class="fieldLabel">Specialties</div>
      <div class="chips">${HORSE_SPECIALTIES.map(s => {
        const on = specs.includes(s);
        return `<button class="chip ${on ? 'on' : ''}" data-act="spec" data-spec="${esc(s)}">${esc(s)}</button>`;
      }).join('')}</div>
      <div class="fieldLabel">Notes</div>
      <textarea data-f="notes" placeholder="Notes, reminders…">${esc(h.notes)}</textarea>
      <div class="fieldLabel">Today's gift (clears daily)</div>
      <textarea class="giftNote" data-f="giftNote" rows="2" placeholder="What to give today…">${esc(h.giftNote)}</textarea>
      <div class="careGrid">${HORSE_TASKS.map(([k, label, icon]) => h.level > 0
        ? `<button class="toggle ${h[k] ? 'on' : ''}" data-act="care" data-task="${k}">${h[k] ? icon + ' ' : ''}${label}</button>`
        : `<button class="toggle" disabled title="Not available at level 0">${label}</button>`).join('')}</div>
    </div>`;
  }).join('') : '<p class="empty">No horses yet.</p>';

  const sort = document.getElementById('sort').value;
  // Find box (partial, case-insensitive name match) and specialty filter
  const findText = findBox.value.trim().toLowerCase();
  const shown = state.villagers.filter(v =>
    (state.specFilter === 'all' || (v.specialty || 'None') === state.specFilter) &&
    (!findText || v.name.toLowerCase().includes(findText)));
  document.getElementById('villagerNames').innerHTML = [...state.villagers].map(v => v.name)
    .sort((a, b) => a.localeCompare(b)).map(n => `<option value="${esc(n)}">`).join('');
  const vs = [...shown].sort((a, b) => lastIfDone(villagerDone(a), villagerDone(b)) || byFav(a, b) || (
    sort === 'default' ? defaultVillagerSort(a, b) :
    sort === 'name'  ? a.name.localeCompare(b.name) :
    sort === 'specialty' ? bySpecialty(a, b) || a.name.localeCompare(b.name) :
    sort === 'level' ? (b.level - a.level) || a.name.localeCompare(b.name) :
    sort === 'levelUp' ? (a.level - b.level) || a.name.localeCompare(b.name) :
    sort === 'uncollected' ? (needsCollect(b) - needsCollect(a)) || a.name.localeCompare(b.name) :
    (needsGift(b) - needsGift(a)) || a.name.localeCompare(b.name)));

  document.getElementById('list').innerHTML = vs.length ? vs.map(v => `
    <div class="card ${villagerColor(v)} ${v.fav ? 'isFav' : ''}" data-kind="villagers" data-id="${v.id}">
      <div class="row">
        ${favButton(v)}
        <input class="name" data-f="name" value="${esc(v.name)}">
        <button class="del" data-act="del" aria-label="Delete" title="Delete">${TRASH}</button>
      </div>
      <div class="row">
        ${levelSelect(v)}
        <select data-f="specialty">${
          SPECIALTIES.map(s => `<option ${v.specialty === s ? 'selected' : ''}>${s}</option>`).join('')
        }</select>
      </div>${v.level === 10 ? bffHtml(v) : ''}
      <div class="fieldLabel">Notes</div>
      <textarea data-f="notes" placeholder="Notes, quests, reminders…">${esc(v.notes)}</textarea>

      <div class="fieldLabel">Today's gift (clears daily)</div>
      <textarea class="giftNote" data-f="giftNote" rows="2" placeholder="What to give today…">${esc(v.giftNote)}</textarea>${giftSlotsHtml(v)}
      <div class="btnRow">
        ${canGift(v)
          ? `<button class="toggle ${v.giftedBtn ? 'on' : ''}" data-act="gift">${v.giftedBtn ? '🎁 Gifted' : 'Gifted'}</button>`
          : `<button class="toggle" disabled title="Not available at level 0">Gifted</button>`}
        ${canCollect(v)
          ? `<button class="toggle ${v.collected ? 'on' : ''}" data-act="collect">${v.collected ? '✅ Collected' : 'Collected'}</button>`
          : `<button class="toggle" disabled title="Unlocks at level 7">Collected</button>`}
      </div>
    </div>`).join('') : `<p class="empty">${state.villagers.length ? 'No villagers match the filter.' : 'No villagers yet.'}</p>`;

  // Level 0 villagers aren't counted toward daily completion
  const counted = state.villagers.filter(canGift);
  const gifted = counted.filter(v => v.gifted).length;
  const collectable = state.villagers.filter(canCollect);
  const collected = collectable.filter(v => v.collected).length;
  const done = state.activities.filter(a => a.done).length;
  const horsesCounted = state.horses.filter(h => h.level > 0);
  const horsesDone = horsesCounted.filter(horseDone).length;
  // Each part turns green on its own once everything in it is done
  const part = (n, total, label) =>
    `<span class="${total > 0 && n === total ? 'allDone' : ''}">${n} of ${total} ${label}</span>`;
  document.getElementById('progress').innerHTML = [
    part(done, state.activities.length, 'activities done'),
    part(horsesDone, horsesCounted.length, 'horses cared for'),
    part(gifted, counted.length, 'gifted'),
    part(collected, collectable.length, 'collected'),
  ].join(' · ');
  document.querySelectorAll('[data-sec]').forEach(el => el.classList.toggle('closed', !!state.collapsed[el.dataset.sec]));
  document.querySelectorAll('.item textarea').forEach(autoGrow);
  document.getElementById('lastReset').textContent =
    state.lastReset ? `Last reset: ${new Date(state.lastReset).toLocaleString()}` : '';
}

// Card interactions (shared by all sections)
const findItem = el => find(el).items.find(i => i.id === el.closest('.item').dataset.item);
const find = el => {
  const card = el.closest('.card');
  return state[card.dataset.kind].find(x => x.id === card.dataset.id);
};

['activities', 'horses', 'list'].forEach(gridId => {
  const grid = document.getElementById(gridId);
  grid.addEventListener('input', e => {
    const f = e.target.dataset.f;
    if (f === 'notes' || f === 'name' || f === 'giftNote') { find(e.target)[f] = e.target.value; save(); }
    if (f === 'giftItem') {
      const slot = e.target.closest('.slot');
      find(e.target).gifts[slot.dataset.slot].item = e.target.value;
      slot.querySelector('.where').textContent = whereText(findItemInfo(e.target.value));
      save();
    }
    if (f === 'itemText') { findItem(e.target).text = e.target.value; autoGrow(e.target); save(); }
  });
  grid.addEventListener('change', e => {
    const f = e.target.dataset.f;
    if (f === 'sparkles') { find(e.target).sparkles = e.target.checked; save(); return; }
    if (f === 'bff') { find(e.target).bff = e.target.checked; save(); render(); return; }
    if (f === 'level' || f === 'specialty') {
      const it = find(e.target);
      it[f] = f === 'level' ? Number(e.target.value) : e.target.value;
      // BFF and gold level only apply to level 10 villagers
      if (f === 'level' && it.level !== 10 && 'bff' in it) { it.bff = false; it.gold = 0; }
      save(); render();
    }
  });
  grid.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    const item = find(btn);
    const kind = btn.closest('.card').dataset.kind;
    if (act === 'gift') {
      if (kind === 'villagers') item.giftedBtn = !item.giftedBtn; else item.gifted = !item.gifted;
    }
    if (act === 'giftSlot') { const g = item.gifts[btn.closest('.slot').dataset.slot]; g.done = !g.done; }
    // Villager counts as gifted when all three gift slots are checked (or the Gifted button is on)
    if (kind === 'villagers' && (act === 'gift' || act === 'giftSlot'))
      item.gifted = item.giftedBtn || item.gifts.every(x => x.done);
    if (act === 'collect') item.collected = !item.collected;
    if (act === 'care') item[btn.dataset.task] = !item[btn.dataset.task];
    if (act === 'spec') {
      const specs = item.specialties = item.specialties || [];
      const s = btn.dataset.spec;
      if (specs.includes(s)) item.specialties = specs.filter(x => x !== s);
      else specs.push(s);
    }
    if (act === 'done') item.done = !item.done;
    if (act === 'addItem') {
      const text = (prompt('Checklist item (e.g. House 1):') || '').trim(); if (!text) return;
      (item.items = item.items || []).push({ id: newId(), text, done: false });
    }
    if (act === 'toggleItem') { const i = findItem(btn); i.done = !i.done; }
    if (act === 'delItem') { const i = findItem(btn); item.items = item.items.filter(x => x !== i); }
    if (act === 'addCounter') {
      const goal = parseInt(prompt('How many do you need to collect?', '3'), 10);
      if (!(goal > 0)) return;
      item.goal = goal; item.count = 0;
    }
    if (act === 'inc') item.count = Math.min(item.goal, (item.count || 0) + 1);
    if (act === 'dec') item.count = Math.max(0, (item.count || 0) - 1);
    if (act === 'delCounter') { delete item.goal; delete item.count; }
    if (['addItem', 'toggleItem', 'delItem', 'addCounter', 'inc', 'dec', 'delCounter'].includes(act) && hasTracking(item))
      item.done = trackingDone(item);
    if (act === 'fav') item.fav = !item.fav;
    if (act === 'snap') item.snap = !item.snap;
    if (act === 'gold') { const n = Number(btn.dataset.n); item.gold = (item.gold || 0) === n ? n - 1 : n; }
    if (act === 'del') {
      if (!confirm(`Remove ${item.name}?`)) return;
      state[kind] = state[kind].filter(x => x !== item);
    }
    save(); render();
  });
});

// Add activity
document.getElementById('addActivity').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newActivity');
  const name = input.value.trim(); if (!name) return;
  state.activities.push({ id: newId(), name, notes: '', done: false, fav: false });
  input.value = ''; save(); render();
});

// Add horse
document.getElementById('addHorse').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newHorse');
  const name = input.value.trim(); if (!name) return;
  state.horses.push({
    id: newId(), name, level: 1, specialties: [], notes: '', giftNote: '', sparkles: false, fav: false,
    pet: false, brush: false, feed: false, ride: false, gifted: false
  });
  input.value = ''; save(); render();
});

// Add villager
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newName');
  const name = input.value.trim(); if (!name) return;
  state.villagers.push({
    id: newId(), name, level: 1, specialty: 'None', notes: '', giftNote: '', gifts: [0, 1, 2].map(() => ({ item: '', done: false })), gifted: false, giftedBtn: false, collected: false, fav: false, snap: false, bff: false, gold: 0
  });
  input.value = ''; save(); render();
});

// Settings
const rt = document.getElementById('resetTime');
const themeSel = document.getElementById('theme');
rt.value = state.resetTime;
themeSel.value = state.theme;
applyTheme();
themeSel.addEventListener('change', () => { state.theme = themeSel.value; applyTheme(); save(); });
rt.addEventListener('change', () => {
  state.resetTime = rt.value || '05:00';
  state.lastReset = Date.now(); // don't wipe today's items just from changing the time
  save(); render();
});
document.getElementById('resetNow').onclick = () => {
  if (confirm("Clear all villager and horse checkmarks (incl. gift checks), BFF and gold levels, today's gift boxes, activity checkmarks, checklists and counters?")) checkReset(true);
};
document.getElementById('sort').onchange = render;
// DLC (label only for now), top notes, collapsible sections and the villager specialty filter
const dlcSel = document.getElementById('dlc');
const notesBox = document.getElementById('generalNotes');
const lookupBox = document.getElementById('itemLookup');
function showLookup() {
  const q = lookupBox.value.trim().toLowerCase();
  const out = document.getElementById('lookupResults');
  if (!q) { out.innerHTML = ''; return; }
  const exact = findItemInfo(q);
  const hits = exact ? [exact] : ITEMS.filter(i => i.name.toLowerCase().includes(q)).slice(0, 8);
  out.innerHTML = hits.length ? hits.map(i => `
    <div class="lookupItem"><b>${esc(i.name)}</b> <span class="meta">${esc(i.kind || i.type)}</span>
      <div>${esc(whereText(i))}</div>
      ${i.from.length ? `<div class="meta">How: ${esc(i.from.join(', '))}</div>` : ''}</div>`).join('')
    : `<div class="meta">${ITEMS.length ? 'No matching items.' : 'Item list is loading…'}</div>`;
}
lookupBox.oninput = showLookup;
const specFilter = document.getElementById('specFilter');
const findBox = document.getElementById('findVillager');
findBox.oninput = render;
document.getElementById('clearFilters').onclick = () => {
  findBox.value = ''; state.specFilter = 'all'; specFilter.value = 'all'; save(); render();
};
specFilter.innerHTML = '<option value="all">All specialties</option>' +
  SPECIALTIES.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
function syncTopControls() {
  dlcSel.value = state.dlc; notesBox.value = state.generalNotes; specFilter.value = state.specFilter;
}
syncTopControls();
dlcSel.onchange = () => { state.dlc = dlcSel.value; save(); };
notesBox.oninput = () => { state.generalNotes = notesBox.value; save(); };
specFilter.onchange = () => { state.specFilter = specFilter.value; save(); render(); };
document.querySelectorAll('.secHead').forEach(h => h.onclick = () => {
  state.collapsed[h.dataset.sec] = !state.collapsed[h.dataset.sec]; save(); render();
});
// Home-screen apps have no browser reload button; this reloads and skips the cached copy so updates show up
document.getElementById('refreshBtn').onclick = () => { save(); location.replace(location.pathname + '?r=' + Date.now()); };
const completedLast = document.getElementById('completedLast');
completedLast.checked = state.completedLast;
completedLast.onchange = () => { state.completedLast = completedLast.checked; save(); render(); };

// Backup / restore
document.getElementById('exportBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(state)); alert('Backup copied! Paste it into a note to keep it safe.'); }
  catch { prompt('Copy this backup text:', JSON.stringify(state)); }
};
// Replaces everything on this device with a backup (pasted text or a loaded file)
function restoreBackup(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.villagers)) throw 0;
    const when = data.savedAt ? ` from ${new Date(data.savedAt).toLocaleString()}` : '';
    if (!confirm(`Replace everything on this device with the backup${when}?`)) return;
    delete data.savedAt;
    state = data; upgrade(); save();
    rt.value = state.resetTime; themeSel.value = state.theme; completedLast.checked = state.completedLast; applyTheme(); syncTopControls();
    checkReset(); render();
    alert('Restored!');
  } catch { alert("That doesn't look like a valid backup."); }
}
document.getElementById('importBtn').onclick = () => {
  const text = prompt('Paste your backup text:'); if (text) restoreBackup(text);
};

// Backup file: the share sheet lets you "Save to Files" (e.g. iCloud Drive); other browsers just download it
const BACKUP_FILE = 'valley-tracker-backup.json';
document.getElementById('saveFileBtn').onclick = async () => {
  const json = JSON.stringify({ ...state, savedAt: Date.now() });
  const file = new File([json], BACKUP_FILE, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = BACKUP_FILE;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const loadInput = document.getElementById('loadFileInput');
document.getElementById('loadFileBtn').onclick = () => loadInput.click();
loadInput.onchange = async () => {
  const f = loadInput.files[0]; loadInput.value = '';
  if (f) restoreBackup(await f.text());
};

// Reset checks: on open, when returning to the app, and every minute
checkReset();
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReset(); });
setInterval(checkReset, 60000);
</script>
</body>
</html>
