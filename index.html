<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Valley Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Felina's Valley Tracker</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Purple theme (default) */
:root{
  --bg:#2a2250;--text:#f3effc;--muted:#c8bfec;--accent:#f4c95d;
  --card:#ebe6fb;--cardText:#141414;--cardMuted:#4a4466;
  --field:#ffffff;--fieldBorder:#c3b8ea;--btn:#d6cdf5;
  --done:#2e9e6a;--doneBg:#dcf3e7;--fav:#e0a800;
}
/* Blue theme */
:root[data-theme="blue"]{
  --bg:#16294a;--text:#eef4ff;--muted:#b9cbe8;
  --card:#e4eefc;--cardMuted:#3f4f68;
  --fieldBorder:#b3c7e6;--btn:#c9daf4;
}
/* Pink theme */
:root[data-theme="pink"]{
  --bg:#682244;--text:#fff0f6;--muted:#f6c6dc;
  --card:#fde6f0;--cardMuted:#6e3a54;
  --fieldBorder:#efb3cd;--btn:#f8cfe1;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:calc(env(safe-area-inset-top) + 8px) 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 0}
h1{margin:0;font-size:1.6rem;color:var(--accent)}
h2{margin:22px 0 4px;font-size:1.25rem;color:var(--accent)}
.progress{color:var(--muted)}
.progress.allDone{color:#5dd39e;font-weight:700}
button,select,input,textarea{font:inherit;color:var(--cardText);background:var(--field);border:1px solid var(--fieldBorder);border-radius:10px;padding:10px}
button{cursor:pointer;background:var(--btn)}
.primary{background:var(--accent);color:#1d1838;border:none;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);color:var(--cardText);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:3px solid transparent}
.card.complete{border-color:var(--done);background:var(--doneBg)}
.card.isFav{border-color:var(--fav)}
.card.complete.isFav{border-color:var(--done)}
.row{display:flex;gap:8px;align-items:center}
.name{font-size:1.2rem;font-weight:700;flex:1;min-width:0;border:none;background:transparent;padding:4px 0}
.toggle{width:100%;padding:14px;font-size:1.05rem;font-weight:600}
.toggle.on{background:var(--done);color:#fff;border:none}
.btnRow{display:flex;gap:8px}
.btnRow .toggle{flex:1;min-width:0}
.toggle:disabled{opacity:.4;cursor:not-allowed}
.giftNote{width:100%}
.card select,.card input:not(.name),.card textarea{font-size:1.08rem;font-weight:700}
.card ::placeholder{font-weight:400}
.fieldLabel{font-size:.85rem;font-weight:600;color:var(--cardMuted);margin-bottom:-4px}
textarea{width:100%;min-height:60px;resize:vertical}
.add{display:flex;gap:8px;margin:8px 0 14px}
.add input{flex:1;min-width:0}
.empty{color:var(--muted);margin:0 0 8px}
details{margin-top:28px;color:var(--muted)}
details .row{flex-wrap:wrap;margin-top:10px}
.del,.fav{background:transparent;border:none;padding:4px 6px;font-size:1.3rem;line-height:1}
.del{color:var(--cardMuted);display:flex}
.del svg{width:20px;height:20px;pointer-events:none}
.fav{color:#9b94b5}
.isFav .fav{color:var(--fav)}
</style>
</head>
<body>
<header>
  <div><h1>Felina's Valley Tracker</h1><div class="progress" id="progress"></div></div>
  <select id="sort" aria-label="Sort villagers">
    <option value="todo">Not gifted first</option>
    <option value="uncollected">Not collected first</option>
    <option value="name">A–Z</option>
    <option value="level">Level: high to low</option>
    <option value="levelUp">Level: low to high</option>
  </select>
</header>

<h2>Daily activities</h2>
<form class="add" id="addActivity">
  <input id="newActivity" placeholder="Add an activity (e.g. Star Path duty)" autocomplete="off">
  <button class="primary">Add</button>
</form>
<div class="grid" id="activities"></div>

<h2>Villagers</h2>
<form class="add" id="addForm">
  <input id="newName" placeholder="Add a villager (e.g. Goofy)" autocomplete="off">
  <button class="primary">Add</button>
</form>
<div class="grid" id="list"></div>

<details>
  <summary>Settings &amp; backup</summary>
  <div class="row">
    <label>Color theme <select id="theme">
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="pink">Pink</option>
    </select></label>
  </div>
  <div class="row">
    <label>Daily reset at <input type="time" id="resetTime"></label>
    <button id="resetNow">Reset daily items now</button>
  </div>
  <div class="row">
    <button id="exportBtn">Copy backup</button>
    <button id="importBtn">Restore from backup</button>
  </div>
  <p id="lastReset"></p>
</details>

<script>
const KEY = 'ddvTracker';
const SPECIALTIES = ['None','Digging','Fishing','Foraging','Gardening','Mining','Timebending','Snippet Hunting'];
let state = JSON.parse(localStorage.getItem(KEY) || 'null') ||
            { villagers: [], resetTime: '05:00', lastReset: 0 };
// Fill in fields added after the first version so older saves keep working
function upgrade() {
  state.activities = state.activities || [];
  state.theme = state.theme || 'purple';
}
upgrade();

const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newId = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
const applyTheme = () => document.documentElement.dataset.theme = state.theme;

// Most recent time the daily reset should have happened
function lastBoundary() {
  const [h, m] = state.resetTime.split(':').map(Number);
  const b = new Date(); b.setHours(h, m, 0, 0);
  if (Date.now() < b) b.setDate(b.getDate() - 1);
  return b.getTime();
}

// Clears gift and collected toggles, "Today's gift" boxes, and activity checkmarks
function checkReset(force) {
  if (force || state.lastReset < lastBoundary()) {
    state.villagers.forEach(v => { v.gifted = false; v.collected = false; v.giftNote = ''; });
    state.activities.forEach(a => { a.done = false; });
    state.lastReset = Date.now();
    save(); render();
  }
}

// Favorites always sort to the top, then the chosen order
const byFav = (a, b) => (!!b.fav - !!a.fav);
// "Collected" only applies to villagers at level 7 or higher
const canCollect = v => v.level >= 7;
const needsCollect = v => canCollect(v) && !v.collected;
// Level 0 villagers can't be gifted yet
const canGift = v => v.level > 0;
const needsGift = v => canGift(v) && !v.gifted;
const villagerDone = v => canGift(v) && v.gifted && (v.collected || !canCollect(v));
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>';
const favButton = item =>
  `<button class="fav" data-act="fav" aria-label="${item.fav ? 'Unfavorite' : 'Favorite'}">${item.fav ? '★' : '☆'}</button>`;

function render() {
  const as = [...state.activities].sort((a, b) =>
    byFav(a, b) || (a.done - b.done) || a.name.localeCompare(b.name));

  document.getElementById('activities').innerHTML = as.length ? as.map(a => `
    <div class="card ${a.done ? 'complete' : ''} ${a.fav ? 'isFav' : ''}" data-kind="activities" data-id="${a.id}">
      <div class="row">
        ${favButton(a)}
        <input class="name" data-f="name" value="${esc(a.name)}">
        <button class="del" data-act="del" aria-label="Delete" title="Delete">${TRASH}</button>
      </div>
      <div class="fieldLabel">Notes</div>
      <textarea data-f="notes" placeholder="Details, where to go, rewards…">${esc(a.notes)}</textarea>
      <button class="toggle ${a.done ? 'on' : ''}" data-act="done">${a.done ? '✅ Done today' : 'Mark complete'}</button>
    </div>`).join('') : '<p class="empty">No daily activities yet.</p>';

  const sort = document.getElementById('sort').value;
  const vs = [...state.villagers].sort((a, b) => byFav(a, b) || (
    sort === 'name'  ? a.name.localeCompare(b.name) :
    sort === 'level' ? (b.level - a.level) || a.name.localeCompare(b.name) :
    sort === 'levelUp' ? (a.level - b.level) || a.name.localeCompare(b.name) :
    sort === 'uncollected' ? (needsCollect(b) - needsCollect(a)) || a.name.localeCompare(b.name) :
    (needsGift(b) - needsGift(a)) || a.name.localeCompare(b.name)));

  document.getElementById('list').innerHTML = vs.length ? vs.map(v => `
    <div class="card ${villagerDone(v) ? 'complete' : ''} ${v.fav ? 'isFav' : ''}" data-kind="villagers" data-id="${v.id}">
      <div class="row">
        ${favButton(v)}
        <input class="name" data-f="name" value="${esc(v.name)}">
        <button class="del" data-act="del" aria-label="Delete" title="Delete">${TRASH}</button>
      </div>
      <div class="row">
        <label>Level <select data-f="level">${
          Array.from({length:11}, (_, i) => `<option ${v.level == i ? 'selected' : ''}>${i}</option>`).join('')
        }</select></label>
        <select data-f="specialty">${
          SPECIALTIES.map(s => `<option ${v.specialty === s ? 'selected' : ''}>${s}</option>`).join('')
        }</select>
      </div>
      <div class="fieldLabel">Notes</div>
      <textarea data-f="notes" placeholder="Notes, quests, reminders…">${esc(v.notes)}</textarea>
      <div class="fieldLabel">Today's gift (clears daily)</div>
      <input class="giftNote" data-f="giftNote" placeholder="What to give today…" value="${esc(v.giftNote)}">
      <div class="btnRow">
        ${canGift(v)
          ? `<button class="toggle ${v.gifted ? 'on' : ''}" data-act="gift">${v.gifted ? '🎁 Gifted' : 'Gifted'}</button>`
          : `<button class="toggle" disabled title="Not available at level 0">Gifted</button>`}
        ${canCollect(v)
          ? `<button class="toggle ${v.collected ? 'on' : ''}" data-act="collect">${v.collected ? '✅ Collected' : 'Collected'}</button>`
          : `<button class="toggle" disabled title="Unlocks at level 7">Collected</button>`}
      </div>
    </div>`).join('') : '<p class="empty">No villagers yet.</p>';

  // Level 0 villagers aren't counted toward daily completion
  const counted = state.villagers.filter(canGift);
  const gifted = counted.filter(v => v.gifted).length;
  const collectable = state.villagers.filter(canCollect);
  const collected = collectable.filter(v => v.collected).length;
  const done = state.activities.filter(a => a.done).length;
  const total = state.activities.length + counted.length + collectable.length;
  const allDone = total > 0 && done + gifted + collected === total;
  const progress = document.getElementById('progress');
  progress.classList.toggle('allDone', allDone);
  progress.textContent =
    `${done} of ${state.activities.length} activities done · ${gifted} of ${counted.length} gifted · ${collected} of ${collectable.length} collected`;
  document.getElementById('lastReset').textContent =
    state.lastReset ? `Last reset: ${new Date(state.lastReset).toLocaleString()}` : '';
}

// Card interactions (shared by both sections)
const find = el => {
  const card = el.closest('.card');
  return state[card.dataset.kind].find(x => x.id === card.dataset.id);
};

['activities', 'list'].forEach(gridId => {
  const grid = document.getElementById(gridId);
  grid.addEventListener('input', e => {
    const f = e.target.dataset.f;
    if (f === 'notes' || f === 'name' || f === 'giftNote') { find(e.target)[f] = e.target.value; save(); }
  });
  grid.addEventListener('change', e => {
    const f = e.target.dataset.f;
    if (f === 'level' || f === 'specialty') {
      find(e.target)[f] = f === 'level' ? Number(e.target.value) : e.target.value;
      save(); render();
    }
  });
  grid.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    const item = find(btn);
    const kind = btn.closest('.card').dataset.kind;
    if (act === 'gift') item.gifted = !item.gifted;
    if (act === 'collect') item.collected = !item.collected;
    if (act === 'done') item.done = !item.done;
    if (act === 'fav') item.fav = !item.fav;
    if (act === 'del') {
      if (!confirm(`Remove ${item.name}?`)) return;
      state[kind] = state[kind].filter(x => x !== item);
    }
    save(); render();
  });
});

// Add activity
document.getElementById('addActivity').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newActivity');
  const name = input.value.trim(); if (!name) return;
  state.activities.push({ id: newId(), name, notes: '', done: false, fav: false });
  input.value = ''; save(); render();
});

// Add villager
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newName');
  const name = input.value.trim(); if (!name) return;
  state.villagers.push({
    id: newId(), name, level: 1, specialty: 'None', notes: '', giftNote: '', gifted: false, collected: false, fav: false
  });
  input.value = ''; save(); render();
});

// Settings
const rt = document.getElementById('resetTime');
const themeSel = document.getElementById('theme');
rt.value = state.resetTime;
themeSel.value = state.theme;
applyTheme();
themeSel.addEventListener('change', () => { state.theme = themeSel.value; applyTheme(); save(); });
rt.addEventListener('change', () => {
  state.resetTime = rt.value || '05:00';
  state.lastReset = Date.now(); // don't wipe today's items just from changing the time
  save(); render();
});
document.getElementById('resetNow').onclick = () => {
  if (confirm("Clear all gifted and collected checkmarks, today's gift boxes, and activity checkmarks?")) checkReset(true);
};
document.getElementById('sort').onchange = render;

// Backup / restore
document.getElementById('exportBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(state)); alert('Backup copied! Paste it into a note to keep it safe.'); }
  catch { prompt('Copy this backup text:', JSON.stringify(state)); }
};
document.getElementById('importBtn').onclick = () => {
  const text = prompt('Paste your backup text:'); if (!text) return;
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.villagers)) throw 0;
    state = data; upgrade(); save();
    rt.value = state.resetTime; themeSel.value = state.theme; applyTheme(); render();
    alert('Restored!');
  } catch { alert("That doesn't look like a valid backup."); }
};

// Reset checks: on open, when returning to the app, and every minute
checkReset();
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReset(); });
setInterval(checkReset, 60000);
</script>
</body>
</html>
