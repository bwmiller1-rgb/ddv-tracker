# Once a week, rebuild items.json from the Dreamlight Valley Wiki and open a pull request if anything changed.
name: Update item list

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-items.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-items
          commit-message: Update item list from the Dreamlight Valley Wiki
          title: Update item list from the Dreamlight Valley Wiki
          body: Weekly automatic refresh of `items.json` (item names and where they're found). Merge to publish.
          add-paths: items.json
